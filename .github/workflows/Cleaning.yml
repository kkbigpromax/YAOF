name: Cleaning

on:
  schedule:
    - cron: 1 1 * * 1
  workflow_dispatch:
    inputs:
      firmware_only:
        description: "Only prune old R2S firmware assets"
        type: boolean
        default: true

jobs:
  
  Cleanup-Old-Releases:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Keep latest two R2S firmware versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 SCRIPTS/11_retain_r2s_releases.py --apply

  Cleanup-Old-Artifacts:
    if: github.event_name != 'workflow_dispatch' || !inputs.firmware_only
    runs-on: ubuntu-24.04
    steps:
    - name: Cleanup Old Action Artifacts
      uses: c-hive/gha-remove-artifacts@main
      with:
          age: '3 days'
          skip-recent: 3
      continue-on-error: true
        
  Cleanup-Workflow-Logs:
    if: github.event_name != 'workflow_dispatch' || !inputs.firmware_only
    runs-on: ubuntu-24.04
    steps:
      - name: Cleanup Workflow Logs
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 3
        continue-on-error: true
