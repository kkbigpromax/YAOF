name: R2S ImageBuilder compatibility
on:
  workflow_dispatch:
  push:
    branches: [25.12]
    paths:
      - .github/workflows/R2S-ImageBuilder-Check.yml
      - .github/workflows/R2S-ImageBuilder.yml
      - SCRIPTS/check_r2s_imagebuilder.sh
      - SCRIPTS/build_r2s_imagebuilder.py
      - SCRIPTS/verify_r2s_delivery.py
      - profiles/**
permissions:
  # Reusable workflow also declares a conditional publisher; publish=false here.
  # Its running build job explicitly reduces its token to contents:read.
  contents: write
jobs:
  check:
    uses: ./.github/workflows/R2S-ImageBuilder.yml
    with:
      build_firmware: true
      publish: false
