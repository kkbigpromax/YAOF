name: R2S ImageBuilder compatibility
on:
  workflow_dispatch:
  push:
    branches: [25.12]
    paths:
      - .github/workflows/R2S-ImageBuilder-Check.yml
      - SCRIPTS/check_r2s_imagebuilder.sh
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zstd unzip make gawk rsync libncurses-dev
      - name: Resolve official R2S and Passwall2 dependencies
        run: bash SCRIPTS/check_r2s_imagebuilder.sh
      - name: Keep compatibility evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: R2S-ImageBuilder-compatibility-${{ github.run_id }}
          path: |
            imagebuilder-check/*.json
            imagebuilder-check/*.txt
            imagebuilder-check/*.log
          retention-days: 7
